name = "prodocstore-mcp"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "mcp.prodocstore.online/*"
zone_name = "prodocstore.online"

[vars]
PUBLIC_BASE_URL = "https://prodocstore.online"
REGISTRY_URL = "https://prodocstore.online/registry.json"
GITHUB_ORG = "ProDocStore-online"
PLATFORM_REPO = "platform"
DEFAULT_DOMAIN = "pages.dev"

# Set MCP_READ_ONLY = "1" to refuse every mutating tool without a code change.
# Left unset in production.

# Secrets (wrangler secret put), NOT vars:
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#
# These belong to ProDocStore's OWN GitHub OAuth app, registered under the
# ProDocStore-online org, callback https://mcp.prodocstore.online/callback.
# It is a different app from the console's (that one is consumed by
# prodocstore-api with callback https://api.prodocstore.online/auth/github/callback),
# and unrelated to the dormant FreeDocStore MCP app. Do not point this worker at
# either of them.
#
# Source of truth for the values is SOPS in ~/dev/ops:
#   sops -d --extract '["pdocs"]["MCP_GITHUB_CLIENT_ID"]'     secrets.enc.yaml
#   sops -d --extract '["pdocs"]["MCP_GITHUB_CLIENT_SECRET"]' secrets.enc.yaml

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "ProDocStoreMcp" }
]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "c883b88e565b410abf9e25ed80c9b7ea"

[[kv_namespaces]]
binding = "PDS_API_KV"
id = "5872e9e5307d450985d985cb4a627a78"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProDocStoreMcp"]
