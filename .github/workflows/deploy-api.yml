name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      allow_migration_failure:
        description: 'Emergency only: deploy even if D1 migrations cannot be applied.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      EXPECTED_GITHUB_CLIENT_ID: Ov23liLxhaOSp6UL7mqr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Detect D1 migration changes
        id: d1-migration-changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual API deploy treats D1 migrations as required."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No stable previous commit; treating D1 migrations as required."
            exit 0
          fi

          if git diff --name-only "$BEFORE" "${{ github.sha }}" -- migrations/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "D1 migration files changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No D1 migration files changed."
          fi
      - name: Apply D1 migrations
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: |
          set -euo pipefail
          if npx wrangler d1 migrations apply prodocstore --remote; then
            echo "D1 migrations applied or already current."
            exit 0
          fi

          if [ "$D1_MIGRATION_CHANGED" = "true" ] && [ "$ALLOW_MIGRATION_FAILURE" != "true" ]; then
            echo "::error::D1 migrations could not be applied for a schema-dependent API deploy. Give CLOUDFLARE_API_TOKEN D1 edit permission, apply migrations manually, or rerun workflow_dispatch with allow_migration_failure=true for an emergency deploy."
            exit 1
          fi

          echo "::warning::D1 migrations were not applied. No migration files changed in this push, so API deploy can continue. Ensure CLOUDFLARE_API_TOKEN has D1 edit access before the next schema-dependent deploy."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN != '' && secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_MIGRATION_CHANGED: ${{ steps.d1-migration-changes.outputs.changed }}
          ALLOW_MIGRATION_FAILURE: ${{ inputs.allow_migration_failure || false }}
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify API OAuth configuration
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: |
          set -euo pipefail
          HEALTH="$(curl -fsS https://api.prodocstore.online/api/health)"
          echo "$HEALTH" | jq .
          if [ "$(echo "$HEALTH" | jq -r '.github.oauthConfigured')" != "true" ]; then
            echo "::error::ProDocStore API deployed, but GitHub OAuth is not configured. Set GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET as Wrangler secrets on prodocstore-api."
            exit 1
          fi
          if [ "$(echo "$HEALTH" | jq -r '.github.clientId')" != "$EXPECTED_GITHUB_CLIENT_ID" ]; then
            echo "::error::ProDocStore API deployed with the wrong GitHub OAuth client id. Expected ${EXPECTED_GITHUB_CLIENT_ID} for callback https://api.prodocstore.online/auth/github/callback."
            exit 1
          fi
          OAUTH="$(curl -fsS https://api.prodocstore.online/api/health/oauth/github)"
          echo "$OAUTH" | jq .
          if [ "$(echo "$OAUTH" | jq -r '.ok')" != "true" ]; then
            echo "::error::ProDocStore API GitHub OAuth client secret was rejected by GitHub. Rotate the Console OAuth app secret and update GITHUB_CLIENT_SECRET on prodocstore-api."
            exit 1
          fi
      - name: Cloudflare secrets missing
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice::API deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as ProDocStore organization Actions secrets."
