name: Verify Cloudflare Pages Access
description: Verify public/private exposure for a deployed ProDocStore Pages KB
inputs:
  project-name:
    required: true
    description: Cloudflare Pages project name
  pages-domain:
    required: true
    description: Cloudflare Pages domain to verify
  protect-site:
    required: true
    description: Whether the KB should be private behind Access
  cf-api-token:
    required: true
    description: Cloudflare API token
  cf-account-id:
    required: true
    description: Cloudflare account ID
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cf-account-id }}
        PROJECT_NAME: ${{ inputs.project-name }}
        PAGES_DOMAIN: ${{ inputs.pages-domain }}
        PROTECT_SITE: ${{ inputs.protect-site }}
      run: bash "${GITHUB_ACTION_PATH}/../../../templates/search/scripts/verify-pages-access.sh"
